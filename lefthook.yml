pre-commit:
    parallel: true
    commands:
        # ── Secret scanning ────────────────────────────────────────────
        secret-scan:
            run: >
                command -v gitleaks >/dev/null 2>&1 && gitleaks protect --staged
                --config .gitleaks.toml || echo "[secret-scan] gitleaks not
                found, skipping (install via:
                https://github.com/gitleaks/gitleaks)"

        # ── Backend, Frontend-Customer, Build-Logic (Spotless) ──────────────────────────────────
        spotless-lint-java:
            glob: '**/*.java'
            run: ./gradlew spotlessJavaCheck
            stage_fixed: false

        spotless-format-java:
            glob: '**/*.java'
            run: ./gradlew spotlessJavaApply
            stage_fixed: true
        spotless-lint-kotlin:
            glob: '**/*.kt'
            run: ./gradlew spotlessKotlinCheck
            stage_fixed: false
        spotless-format-kotlin:
            glob: '**/*.kt'
            run: ./gradlew spotlessKotlinApply
            stage_fixed: true
        spotless-lint-kotlin-gradle:
            glob: '**/*.kts'
            run: ./gradlew spotlessKotlinGradleCheck
            stage_fixed: false
        spotless-format-kotlin-gradle:
            glob: '**/*.kts'
            run: ./gradlew spotlessKotlinGradleApply
            stage_fixed: true

        # ── Frontend / Admin – TypeScript (Biome) ─────────────────────
        admin-lint:
            root: 'frontend/admin/'
            glob: '**/*.{ts,tsx,js,jsx,json}'
            run: bun --bun run lint

        admin-format:
            root: 'frontend/admin/'
            glob: '**/*.{ts,tsx,js,jsx,json}'
            run: bun --bun run format
            stage_fixed: true

        # ── Database – SQL (Prettier) ─────────────────────────────────────
        database-format:
            root: 'database/'
            glob: '**/*.sql'
            run: bun --bun run format
            stage_fixed: true

commit-msg:
    commands:
        commitlint:
            run: node_modules/.bin/commitlint --edit {1}
