pre-commit:
    parallel: true
    commands:
        # ── Secret scanning ────────────────────────────────────────────
        secret-scan:
            run: >
                command -v gitleaks >/dev/null 2>&1 && gitleaks protect --staged
                --config .gitleaks.toml || echo "[secret-scan] gitleaks not
                found, skipping (install via:
                https://github.com/gitleaks/gitleaks)"

        # ── Backend ──────────────────────────────────
        backend-format:
            root: 'backend/'
            glob: '**/*.{java,kt,kts}'
            exclude:
                - 'third_party/**'
            run: ./gradlew spotlessApply
            stage_fixed: true

        # ── Build logic ──────────────────────────────────
        build-logic-format:
            glob: 'build-logic/**/*.{kt,kts}'
            run: ./gradlew ktlintFormat
            stage_fixed: true

        # ── Frontend / Customer ──────────────────────────────────
        customer-format:
            root: 'frontend/customer/'
            glob: '**/*.{ts,tsx,js,jsx,json}'
            run: bun run lint:fix
            stage_fixed: true

        # ── Database – SQL (Prettier) ─────────────────────────────────────
        database-format:
            glob: '**/*.sql'
            run: bunx prettier --write {staged_files}
            stage_fixed: true

commit-msg:
    commands:
        commitlint:
            run: node_modules/.bin/commitlint --edit {1}
