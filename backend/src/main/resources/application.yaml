spring:
    application:
        name: backend
    threads:
        virtual:
            enabled: true
    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trainbooking}
        username: ${SPRING_DATASOURCE_USERNAME:postgres}
        password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    flyway:
        locations: classpath:db/migration
        baseline-on-migrate: true
        baseline-version: 0
    cache:
        type: redis
        cache-names:
            - scheduledTripList
            - scheduledTripById
            - coachSeatMap
            - scheduledTripFilter
            - stationSearch
    data:
        redis:
            host: ${VALKEY_HOST:localhost}
            port: ${VALKEY_PORT:6379}
            lettuce:
                pool:
                    enabled: true
                    max-active: 8
                    max-idle: 8
                    min-idle: 2
                    max-wait: 2s
            repositories:
                enabled: false
jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:900}
    refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:604800}

stripe:
    api-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    success-url: ${STRIPE_SUCCESS_URL}
    cancel-url: ${STRIPE_CANCEL_URL}

booking:
    cancel-url: ${STRIPE_CANCEL_URL}
    max-seats-per-booking: ${BOOKING_MAX_SEATS:5}

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html
        enabled: true
    auto-disable-spring-security: false
    override-with-generic-response: false
