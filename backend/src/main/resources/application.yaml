spring:
  application:
    name: backend
  threads:
    virtual:
        enabled: true
  mvc:
    apiversion:
      use:
        path-segment: 1
      supported: 1.0
      default: 1.0

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:900}
  refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:604800}

