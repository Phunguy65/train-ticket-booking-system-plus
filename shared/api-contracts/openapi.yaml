components:
  schemas:
    FailData:
      description: "Shared payload used inside JSend fail responses."
      properties:
        message:
          type: "string"
          description: "Human-readable summary of the failure."
        code:
          $ref: "#/components/schemas/ErrorCode"
        errors:
          type: "array"
          items:
            $ref: "#/components/schemas/Violation"
    ErrorCode:
      type: "string"
      description: "Machine-readable error code carried by shared fail responses."
      enum:
      - "VALIDATION_ERROR"
      - "CURSOR_INVALID"
      - "ACCESS_DENIED"
      - "USER_EMAIL_ALREADY_EXISTS"
      - "USER_INVALID_CREDENTIALS"
      - "USER_INVALID_REFRESH_TOKEN"
      - "USER_NOT_FOUND"
      - "USER_CANNOT_BULK_DELETE_SELF"
      - "USER_HAS_ACTIVE_BOOKINGS"
      - "BOOKING_NOT_FOUND"
      - "BOOKING_CANNOT_CONFIRM"
      - "BOOKING_ALREADY_CANCELLED"
      - "TRAIN_NUMBER_ALREADY_EXISTS"
      - "TRAIN_NOT_FOUND"
      - "TRAIN_IN_USE"
      - "SEAT_NOT_FOUND"
      - "SEAT_NUMBER_ALREADY_EXISTS"
      - "SEAT_NOT_AVAILABLE"
      - "SEAT_IN_USE"
      - "SCHEDULED_TRIP_NOT_FOUND"
      - "COACH_NOT_FOUND"
      - "COACH_CAR_NUMBER_ALREADY_EXISTS"
      - "COACH_TRAIN_NOT_FOUND"
      - "COACH_IN_USE"
      - "COACH_CAR_NUMBERS_ALREADY_EXIST"
      - "COACH_DUPLICATE_CAR_NUMBERS_IN_REQUEST"
      - "SEAT_NUMBERS_ALREADY_EXIST"
      - "SEAT_DUPLICATE_SEAT_NUMBERS_IN_REQUEST"
      - "ROUTE_TEMPLATE_NOT_FOUND"
      - "STATION_NOT_FOUND"
      - "STATION_CODE_ALREADY_EXISTS"
      - "STATION_IN_USE"
      - "PAYMENT_NOT_FOUND"
      - "PAYMENT_ALREADY_PROCESSED"
      - "PAYMENT_REFUND_FAILED"
      - "PAYMENT_BOOKING_NOT_FOUND"
      - "PAYMENT_BOOKING_INVALID_STATE"
    Violation:
      description: "Field-level validation issue inside a fail response."
      properties:
        field:
          type: "string"
          description: "Request field that failed validation."
        message:
          type: "string"
          description: "Human-readable validation message."
        code:
          $ref: "#/components/schemas/ViolationCode"
    ViolationCode:
      type: "string"
      description: "Machine-readable validation category attached to a field violation."
      enum:
      - "REQUIRED"
      - "INVALID_FORMAT"
      - "TOO_SHORT"
      - "TOO_LONG"
      - "INVALID_VALUE"
    JsendFailResponse:
      type: "object"
      description: "Shared JSend fail envelope used for validation and domain errors."
      properties:
        status:
          type: "string"
          enum:
          - "fail"
        data:
          $ref: "#/components/schemas/FailData"
    JsendErrorResponse:
      type: "object"
      description: "Shared JSend error envelope used for unexpected technical failures."
      properties:
        status:
          type: "string"
          enum:
          - "error"
        message:
          type: "string"
          description: "Human-readable technical failure message."
    UpdateAuthenticatedUserRequest:
      type: "object"
      description: "Full replacement payload for the authenticated customer profile.\
        \ Send the complete editable profile state."
      properties:
        fullName:
          type: "string"
          description: "Updated full name."
          example: "Nguyen Phuong"
          minLength: 1
        email:
          type: "string"
          format: "email"
          description: "Updated email address."
          example: "customer@example.com"
          minLength: 1
        phone:
          type:
          - "string"
          - "null"
          description: "Updated phone number."
          example: "+84901234567"
          pattern: ".*\\S.*"
        dateOfBirth:
          type:
          - "string"
          - "null"
          format: "date"
          description: "Updated date of birth."
        gender:
          type:
          - "string"
          - "null"
          description: "Updated self-declared gender label."
          example: "female"
          pattern: ".*\\S.*"
        idDocumentNumber:
          type:
          - "string"
          - "null"
          description: "Updated government-issued identity document number."
          example: "redacted-id-document"
          pattern: ".*\\S.*"
          writeOnly: true
        addressLine:
          type:
          - "string"
          - "null"
          description: "Updated address line."
          example: "redacted-address"
          pattern: ".*\\S.*"
      required:
      - "email"
      - "fullName"
    JsendResponseObject:
      type: "object"
      description: "Runtime JSend response envelope used by the API implementation."
      properties:
        status:
          type: "string"
          description: "JSend status value."
          enum:
          - "success"
          - "fail"
          - "error"
        data:
          description: "Payload returned for the response status."
        message:
          type: "string"
          description: "Human-readable technical error message for error responses."
    CreateBookingRequest:
      type: "object"
      description: "Booking creation payload."
      properties:
        scheduledTripId:
          type: "string"
          format: "uuid"
          description: "Scheduled trip to book."
        seatIds:
          type: "array"
          items:
            type: "string"
            format: "uuid"
            description: "Seat identifier."
          minItems: 1
        passengers:
          type: "array"
          items:
            $ref: "#/components/schemas/PassengerInput"
          minItems: 1
        idempotencyKey:
          type: "string"
          description: "Client-generated idempotency key used to safely retry booking\
            \ creation."
          example: "booking-create-request-001"
          minLength: 1
          writeOnly: true
      required:
      - "idempotencyKey"
      - "passengers"
      - "scheduledTripId"
      - "seatIds"
    PassengerInput:
      type: "object"
      description: "Passenger input for a booking seat."
      properties:
        seatId:
          type: "string"
          format: "uuid"
          description: "Seat identifier for this passenger."
        fullName:
          type: "string"
          description: "Passenger full name."
          example: "Nguyen Van A"
          minLength: 1
        idDocumentNumber:
          type: "string"
          description: "Passenger identity document number."
          example: "001234567890"
          minLength: 1
        dateOfBirth:
          type: "string"
          format: "date"
          description: "Passenger date of birth."
        gender:
          type: "string"
          description: "Passenger gender."
          example: "male"
          minLength: 1
      required:
      - "dateOfBirth"
      - "fullName"
      - "gender"
      - "idDocumentNumber"
      - "seatId"
    RegisterRequest:
      type: "object"
      description: "Customer registration payload."
      properties:
        email:
          type: "string"
          format: "email"
          description: "Email address used to sign in."
          example: "customer@example.com"
          minLength: 1
        password:
          type: "string"
          description: "Account password. The value is accepted on write and never\
            \ returned."
          example: "********"
          maxLength: 2147483647
          minLength: 8
          writeOnly: true
        fullName:
          type: "string"
          description: "Customer full name."
          example: "Nguyen Phuong"
          minLength: 1
      required:
      - "email"
      - "fullName"
      - "password"
    RefreshTokenRequest:
      type: "object"
      description: "Refresh-token payload used to rotate or revoke a session."
      properties:
        refreshToken:
          type: "string"
          description: "Refresh token issued during login. The value is accepted on\
            \ write and never returned."
          example: "redacted-refresh-token"
          minLength: 1
          writeOnly: true
      required:
      - "refreshToken"
    LoginRequest:
      type: "object"
      description: "Customer login payload."
      properties:
        email:
          type: "string"
          format: "email"
          description: "Email address used to sign in."
          example: "customer@example.com"
          minLength: 1
        password:
          type: "string"
          description: "Account password. The value is accepted on write and never\
            \ returned."
          example: "********"
          minLength: 1
          writeOnly: true
      required:
      - "email"
      - "password"
    GetUserPaymentsRequest:
      type: "object"
      description: "Offset-based pagination query for a customer's payment history."
      properties:
        page:
          type: "integer"
          format: "int32"
          description: "Zero-based page index."
          example: 0
          minimum: 0
        size:
          type: "integer"
          format: "int32"
          description: "Number of payments per page."
          example: 20
          maximum: 100
          minimum: 1
    GetUserBookingsRequest:
      type: "object"
      description: "Offset-based pagination query for a customer's booking history."
      properties:
        page:
          type: "integer"
          format: "int32"
          description: "Zero-based page index."
          example: 0
