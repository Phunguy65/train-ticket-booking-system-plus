    GetBookingDetailRequest:
      description: "No additional query parameters are accepted when fetching a booking\
        \ detail."
    GetPaymentByBookingIdRequest:
      description: "No additional query parameters are accepted when fetching the\
        \ payment for a booking."
    UserResponse:
      description: "Customer profile returned by authenticated user endpoints."
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "Customer identifier."
          readOnly: true
        email:
          type: "string"
          description: "Customer email address."
          example: "customer@example.com"
        fullName:
          type: "string"
          description: "Customer full name."
          example: "Nguyen Phuong"
        phone:
          type: "string"
          description: "Customer phone number."
          example: "+84901234567"
        dateOfBirth:
          type: "string"
          format: "date"
          description: "Customer date of birth."
        gender:
          type: "string"
          description: "Customer self-declared gender label."
