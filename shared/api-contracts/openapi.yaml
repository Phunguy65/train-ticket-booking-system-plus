---
openapi: "3.1.0"
info:
  title: "TTBS Customer API"
  description: "Customer-facing API contract for the train ticket booking system."
  version: "1.0"
servers:
- url: "/api"
  description: "Versioned customer API root"
security:
- bearerAuth: []
tags:
- name: "Authentication"
  description: "Customer identity, session, and profile endpoints."
- name: "Bookings"
  description: "Customer booking creation, lookup, and cancellation endpoints."
- name: "Payments"
  description: "Customer payment lookup endpoints."
- name: "Stations"
  description: "Station browse and search endpoints."
- name: "Trains"
  description: "Train, coach, seat, and route lookup endpoints."
paths:
  /api/{version}/auth/me:
    get:
      tags:
      - "Authentication"
      summary: "Get the current customer profile"
      operationId: "getAuthenticatedUser"
      responses:
        "200":
          description: "Authenticated customer profile"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendResponseObject"
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: "Authentication required"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "404":
          description: "Customer profile not found"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "500":
          description: "Unexpected technical failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsendErrorResponse"
      security:
      - bearerAuth: []
    put:
      tags:
      - "Authentication"
      summary: "Replace the current customer profile"
      description: "Performs a full replacement of the authenticated customer's editable\
        \ profile fields."
      operationId: "updateAuthenticatedUser"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAuthenticatedUserRequest"
        required: true
      responses:
        "200":
          description: "Customer profile updated"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendResponseObject"
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Invalid update payload"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "401":
          description: "Authentication required"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "404":
          description: "Customer profile not found"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "409":
          description: "Email address already exists"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "500":
          description: "Unexpected technical failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsendErrorResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - "Authentication"
      summary: "Soft-delete the current customer account"
      operationId: "deleteAuthenticatedUser"
      responses:
        "200":
          description: "Customer account deleted"
        "401":
          description: "Authentication required"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "404":
          description: "Customer profile not found"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "409":
          description: "Customer still has active bookings"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "500":
          description: "Unexpected technical failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsendErrorResponse"
      security:
      - bearerAuth: []
  /api/{version}/bookings:
    post:
      tags:
      - "Bookings"
      summary: "Create a booking"
      operationId: "createBooking"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
        required: true
      responses:
        "201":
          description: "Booking created"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendResponseObject"
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "400":
          description: "Invalid booking payload"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "404":
          description: "Scheduled trip or customer not found"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "409":
          description: "Booking cannot be created because seats are unavailable or\
            \ already held"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "500":
          description: "Unexpected technical failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsendErrorResponse"
      security:
      - bearerAuth: []
  /api/{version}/bookings/{id}/cancel:
    post:
      tags:
      - "Bookings"
      summary: "Cancel an existing booking"
      operationId: "cancelBooking"
      parameters:
      - name: "id"
        in: "path"
        description: "Booking identifier"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "Booking cancelled"
        "403":
          description: "Customer cannot cancel this booking"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "404":
          description: "Booking not found"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "409":
          description: "Booking cannot transition to cancelled state"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "500":
          description: "Unexpected technical failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsendErrorResponse"
      security:
      - bearerAuth: []
  /api/{version}/bookings/{bookingId}/checkout:
    post:
      tags:
      - "Payments"
      summary: "Create a Stripe checkout session for a booking"
      operationId: "createCheckoutSession"
      parameters:
      - name: "bookingId"
        in: "path"
        description: "Booking identifier"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "201":
          description: "Checkout session created"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendResponseObject"
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResponse"
        "200":
          description: "Checkout session already exists (idempotent)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendResponseObject"
        "403":
          description: "Customer cannot create a payment for this booking"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "404":
          description: "Booking not found"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "409":
          description: "Booking is not in a payable state or payment was already processed"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "500":
          description: "Unexpected technical failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsendErrorResponse"
      security:
      - bearerAuth: []
  /api/{version}/auth/register:
    post:
      tags:
      - "Authentication"
      summary: "Register a customer account"
      operationId: "register"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: "Customer account created"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendResponseObject"
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Invalid registration payload"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "409":
          description: "Email address already exists"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "500":
          description: "Unexpected technical failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsendErrorResponse"
  /api/{version}/auth/refresh:
    post:
      tags:
      - "Authentication"
      summary: "Rotate access and refresh tokens"
      operationId: "refreshToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: "Token pair rotated"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendResponseObject"
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResultResponse"
        "400":
          description: "Invalid refresh-token payload"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "401":
          description: "Refresh token is invalid or expired"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "500":
          description: "Unexpected technical failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsendErrorResponse"
  /api/{version}/auth/logout:
    post:
      tags:
      - "Authentication"
      summary: "Revoke the current refresh token"
      operationId: "logout"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: "Refresh token revoked"
        "400":
          description: "Invalid refresh-token payload"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "401":
          description: "Refresh token is invalid or expired"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "500":
          description: "Unexpected technical failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsendErrorResponse"
  /api/{version}/auth/login:
    post:
      tags:
      - "Authentication"
      summary: "Authenticate a customer"
      operationId: "login"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: "Authentication successful"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendResponseObject"
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResultResponse"
        "400":
          description: "Invalid login payload"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "401":
          description: "Invalid customer credentials"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "500":
          description: "Unexpected technical failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsendErrorResponse"
  /api/{version}/users/{userId}/payments:
    get:
      tags:
      - "Payments"
      summary: "List payments for a customer"
      operationId: "getUserPayments"
      parameters:
      - name: "userId"
        in: "path"
        description: "Customer identifier that owns the payments"
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "request"
        in: "query"
        required: true
        schema:
          $ref: "#/components/schemas/GetUserPaymentsRequest"
      responses:
        "200":
          description: "Paged payment history"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendResponseObject"
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseUserPaymentResponse"
        "400":
          description: "Invalid pagination parameters"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "403":
          description: "Customer cannot access another customer's payments"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "500":
          description: "Unexpected technical failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsendErrorResponse"
      security:
      - bearerAuth: []
  /api/{version}/users/{userId}/bookings:
    get:
      tags:
      - "Bookings"
      summary: "List bookings for a customer"
      operationId: "getUserBookings"
      parameters:
      - name: "userId"
        in: "path"
        description: "Customer identifier that owns the bookings"
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "request"
        in: "query"
        required: true
        schema:
          $ref: "#/components/schemas/GetUserBookingsRequest"
      responses:
        "200":
          description: "Paged booking history"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendResponseObject"
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseUserBookingResponse"
        "400":
          description: "Invalid pagination parameters"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "403":
          description: "Customer cannot access another customer's bookings"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "500":
          description: "Unexpected technical failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsendErrorResponse"
      security:
      - bearerAuth: []
  /api/{version}/trains:
    get:
      tags:
      - "Trains"
      summary: "List trains"
      operationId: "getTrains"
      parameters:
      - name: "request"
        in: "query"
        required: true
        schema:
          $ref: "#/components/schemas/GetTrainsRequest"
      responses:
        "200":
          description: "Paged train catalog"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendResponseObject"
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseTrainResponse"
        "400":
          description: "Invalid pagination parameters"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "500":
          description: "Unexpected technical failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsendErrorResponse"
  /api/{version}/trains/{trainId}/seats:
    get:
      tags:
      - "Trains"
      summary: "List seats for a train"
      operationId: "getTrainSeats"
      parameters:
      - name: "trainId"
        in: "path"
        description: "Train identifier"
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "request"
        in: "query"
        required: true
        schema:
          $ref: "#/components/schemas/GetSeatsRequest"
      responses:
        "200":
          description: "Paged seats for the train"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendResponseObject"
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseSeatResponse"
        "400":
          description: "Invalid pagination parameters"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "500":
          description: "Unexpected technical failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsendErrorResponse"
  /api/{version}/trains/{trainId}/coaches:
    get:
      tags:
      - "Trains"
      summary: "List coaches for a train"
      operationId: "getTrainCoaches"
      parameters:
      - name: "trainId"
        in: "path"
        description: "Train identifier"
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "request"
        in: "query"
        required: true
        schema:
          $ref: "#/components/schemas/GetCoachesRequest"
      responses:
        "200":
          description: "Paged coaches for the train"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendResponseObject"
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseCoachResponse"
        "400":
          description: "Invalid pagination parameters"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "404":
          description: "Train not found"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "500":
          description: "Unexpected technical failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsendErrorResponse"
  /api/{version}/trains/{trainId}/coaches/{id}:
    get:
      tags:
      - "Trains"
      summary: "Get a coach by id"
      operationId: "getTrainCoach"
      parameters:
      - name: "trainId"
        in: "path"
        description: "Train identifier"
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "id"
        in: "path"
        description: "Coach identifier"
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "request"
        in: "query"
        required: true
        schema:
          $ref: "#/components/schemas/GetCoachByIdRequest"
      responses:
        "200":
          description: "Coach detail"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendResponseObject"
            application/json:
              schema:
                $ref: "#/components/schemas/CoachResponse"
        "404":
          description: "Coach or train not found"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "500":
          description: "Unexpected technical failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsendErrorResponse"
  /api/{version}/trains/{id}:
    get:
      tags:
      - "Trains"
      summary: "Get a train by id"
      operationId: "getTrain"
      parameters:
      - name: "id"
        in: "path"
        description: "Train identifier"
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "request"
        in: "query"
        required: true
        schema:
          $ref: "#/components/schemas/GetTrainByIdRequest"
      responses:
        "200":
          description: "Train detail"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendResponseObject"
            application/json:
              schema:
                $ref: "#/components/schemas/TrainResponse"
        "404":
          description: "Train not found"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "500":
          description: "Unexpected technical failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsendErrorResponse"
  /api/{version}/stations:
    get:
      tags:
      - "Stations"
      summary: "List stations"
      operationId: "getStations"
      parameters:
      - name: "request"
        in: "query"
        required: true
        schema:
          $ref: "#/components/schemas/GetStationsRequest"
      responses:
        "200":
          description: "Paged station catalog"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendResponseObject"
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseStationResponse"
        "400":
          description: "Invalid pagination parameters"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "500":
          description: "Unexpected technical failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsendErrorResponse"
  /api/{version}/stations/{id}:
    get:
      tags:
      - "Stations"
      summary: "Get a station by id"
      operationId: "getStation"
      parameters:
      - name: "id"
        in: "path"
        description: "Station identifier"
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "request"
        in: "query"
        required: true
        schema:
          $ref: "#/components/schemas/GetStationByIdRequest"
      responses:
        "200":
          description: "Station detail"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendResponseObject"
            application/json:
              schema:
                $ref: "#/components/schemas/StationResponse"
        "404":
          description: "Station not found"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "500":
          description: "Unexpected technical failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsendErrorResponse"
  /api/{version}/stations/search:
    get:
      tags:
      - "Stations"
      summary: "Search stations by keyword"
      operationId: "searchStations"
      parameters:
      - name: "request"
        in: "query"
        required: true
        schema:
          $ref: "#/components/schemas/SearchStationsRequest"
      responses:
        "200":
          description: "Matching station suggestions"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendResponseObject"
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/StationSearchResponse"
        "400":
          description: "Invalid station search parameters"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "500":
          description: "Unexpected technical failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsendErrorResponse"
  /api/{version}/scheduled-trips:
    get:
      tags:
      - "Trains"
      summary: "List scheduled trips"
      operationId: "getScheduledTrips"
      parameters:
      - name: "request"
        in: "query"
        required: true
        schema:
          $ref: "#/components/schemas/GetScheduledTripsRequest"
      responses:
        "200":
          description: "Paged scheduled trips"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendResponseObject"
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseScheduledTripResponse"
        "400":
          description: "Invalid pagination parameters"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "500":
          description: "Unexpected technical failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsendErrorResponse"
  /api/{version}/scheduled-trips:filter:
    get:
      tags:
      - "Trains"
      summary: "Filter scheduled trips"
      operationId: "filterScheduledTrips"
      parameters:
      - name: "request"
        in: "query"
        required: true
        schema:
          $ref: "#/components/schemas/SearchScheduledTripsRequest"
      responses:
        "200":
          description: "Cursor-paged scheduled trip search results"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendResponseObject"
            application/json:
              schema:
                $ref: "#/components/schemas/SliceResponseSearchScheduledTripsResponse"
        "400":
          description: "Invalid scheduled trip filter parameters"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendFailResponse"
        "500":
          description: "Unexpected technical failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsendErrorResponse"
  /api/{version}/scheduled-trips/{scheduledTripId}/seats/available:
    get:
      tags:
      - "Trains"
      summary: "List available seats for a scheduled trip"
      operationId: "getAvailableSeats"
      parameters:
      - name: "scheduledTripId"
        in: "path"
        description: "Scheduled trip identifier"
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "request"
        in: "query"
        required: true
        schema:
          $ref: "#/components/schemas/GetAvailableSeatsRequest"
      responses:
        "200":
          description: "Paged available seats"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsendResponseObject"
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseSeatResponse"
        "400":
          description: "Invalid seat filter or pagination parameters"
