          type: "number"
          description: "Payment amount in major currency units."
          example: 650000
        currency:
          type: "string"
          description: "ISO-like currency code."
          example: "VND"
        createdAt:
          type: "string"
          format: "date-time"
          description: "Payment creation timestamp."
          readOnly: true
        booking:
          $ref: "#/components/schemas/BookingForTicket"
    SeatInfo:
      description: "Seat information for ticket printing."
      properties:
        seatId:
          type: "string"
          format: "uuid"
          description: "Seat identifier."
        coachNumber:
          type: "integer"
          format: "int32"
          description: "Coach car number."
          example: 5
        seatNumber:
          type: "string"
          description: "Seat label shown to customers."
          example: "12A"
    TripInfo:
      description: "Trip data with train and route information for ticket printing."
      properties:
        trainName:
          type: "string"
          description: "Train name."
          example: "SE1"
        trainNumber:
          type: "string"
          description: "Train number."
          example: "SE001"
        origin:
          type: "string"
          description: "Origin station name."
          example: "Hanoi"
        destination:
          type: "string"
          description: "Destination station name."
          example: "Ho Chi Minh City"
        departureTime:
          type: "string"
          format: "date-time"
          description: "Scheduled departure timestamp."
        arrivalTime:
          type: "string"
          format: "date-time"
          description: "Scheduled arrival timestamp."
    BookingDetailResponse:
      description: "Detailed booking resource with trip, seat, and payment information."
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "Booking identifier."
          readOnly: true
        userId:
          type: "string"
          format: "uuid"
          description: "Customer identifier that owns the booking."
        scheduledTripId:
          type: "string"
          format: "uuid"
          description: "Scheduled trip identifier."
        bookerInfo:
          $ref: "#/components/schemas/PassengerInfoResponse"
        passengers:
          type: "array"
          items:
            $ref: "#/components/schemas/PassengerResponse"
        totalPrice:
          type: "integer"
          format: "int64"
          description: "Booking total in minor currency units."
          example: 650000
        currency:
          type: "string"
          description: "ISO-like currency code."
          example: "VND"
        status:
          type: "string"
          description: "Booking lifecycle status."
          enum:
          - "HELD"
          - "CONFIRMED"
          - "CANCELLED"
        paymentDeadline:
          type: "string"
          format: "date-time"
          description: "Deadline for completing payment before the booking expires."
        createdAt:
          type: "string"
          format: "date-time"
          description: "Booking creation timestamp."
          readOnly: true
        trip:
          $ref: "#/components/schemas/Trip"
        payment:
          $ref: "#/components/schemas/PaymentDetailResponse"
        seats:
          type: "array"
          items:
            $ref: "#/components/schemas/Seat"
    Trip:
      description: "Trip summary embedded inside a booking detail."
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "Scheduled trip identifier."
        routeTemplateId:
          type: "string"
          format: "uuid"
          description: "Route template identifier."
        trainId:
          type: "string"
          format: "uuid"
          description: "Train identifier."
        departureTime:
          type: "string"
          format: "date-time"
          description: "Scheduled departure timestamp."
        arrivalTime:
          type: "string"
          format: "date-time"
          description: "Scheduled arrival timestamp."
        status:
          type: "string"
          description: "Scheduled trip status."
        createdAt:
          type: "string"
          format: "date-time"
          description: "Scheduled trip creation timestamp."
        train:
          $ref: "#/components/schemas/Train"
        route:
          $ref: "#/components/schemas/Route"
    PaymentResponse:
      description: "Payment resource exposed to customers."
      properties:
        paymentId:
          type: "string"
          format: "uuid"
          description: "Payment identifier."
        bookingId:
          type: "string"
          format: "uuid"
          description: "Booking identifier linked to the payment."
        status:
          type: "string"
          description: "Payment lifecycle status."
          enum:
          - "PENDING"
          - "PAID"
          - "CANCELLED"
          - "FAILED"
          - "REFUNDED"
        checkoutUrl:
          type: "string"
          format: "uri"
          description: "Hosted checkout URL when customer action is still required."
        amount:
          type: "number"
          description: "Payment amount in major currency units."
          example: 650000
        currency:
          type: "string"
          description: "ISO-like currency code."
          example: "VND"
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
