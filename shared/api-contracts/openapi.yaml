        size:
          type: "integer"
          format: "int32"
          description: "Number of trains per page."
          example: 20
          maximum: 100
          minimum: 1
    GetSeatsRequest:
      type: "object"
      description: "Offset-based pagination query for seats belonging to a train."
      properties:
