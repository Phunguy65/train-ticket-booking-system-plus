          minimum: 1
    GetCoachByIdRequest:
      description: "No additional query parameters are accepted when fetching a coach."
    GetTrainByIdRequest:
      description: "No additional query parameters are accepted when fetching a train."
    GetStationsRequest:
      type: "object"
      description: "Offset-based pagination query for stations."
      properties:
        page:
          type: "integer"
          format: "int32"
          description: "Zero-based page index."
          example: 0
          minimum: 0
        size:
          type: "integer"
          format: "int32"
          description: "Number of stations per page."
          example: 20
          maximum: 100
          minimum: 1
    GetStationByIdRequest:
      description: "No additional query parameters are accepted when fetching a station."
    SearchStationsRequest:
      type: "object"
      description: "Station auto-complete query."
      properties:
        q:
          type: "string"
          description: "Free-text station search term."
          example: "ha noi"
        limit:
          type: "integer"
          format: "int32"
          description: "Maximum number of station suggestions to return."
          example: 10
          maximum: 20
          minimum: 1
    GetScheduledTripsRequest:
      type: "object"
      description: "Offset-based pagination query for scheduled trips."
      properties:
        page:
          type: "integer"
          format: "int32"
          description: "Zero-based page index."
          example: 0
          minimum: 0
        size:
          type: "integer"
          format: "int32"
          description: "Number of scheduled trips per page."
          example: 20
          maximum: 100
          minimum: 1
    SearchScheduledTripsRequest:
      type: "object"
      description: "Cursor-based search query for scheduled trips."
      properties:
        originStationId:
          type: "string"
          format: "uuid"
          description: "Origin station filter."
        destinationStationId:
          type: "string"
          format: "uuid"
          description: "Destination station filter."
        departureDate:
          type: "string"
          format: "date"
          description: "Departure date filter."
        status:
          type: "string"
          description: "Scheduled trip status filter."
          enum:
          - "SCHEDULED"
          - "BOARDING"
          - "DEPARTED"
          - "ARRIVED"
          - "CANCELLED"
          pattern: "SCHEDULED|BOARDING|DEPARTED|ARRIVED|CANCELLED"
        availableOnly:
          type: "boolean"
          description: "When true, only trips with currently available seats are returned."
          example: true
        minPrice:
          type: "integer"
          format: "int64"
          description: "Minimum fare filter in minor currency units."
          example: 350000
          minimum: 0
        maxPrice:
          type: "integer"
          format: "int64"
          description: "Maximum fare filter in minor currency units."
          example: 950000
          minimum: 0
        sortBy:
          type: "string"
          description: "Field used to sort results."
          enum:
          - "DEPARTURE_TIME"
          - "PRICE"
          - "DURATION"
          - "AVAILABLE_SEATS"
          pattern: "DEPARTURE_TIME|PRICE|DURATION|AVAILABLE_SEATS"
        sortDirection:
          type: "string"
          description: "Sort direction."
          enum:
          - "ASC"
          - "DESC"
          pattern: "ASC|DESC"
        cursor:
          type: "string"
          description: "Opaque cursor from the previous search page. Omit to start\
            \ from the beginning."
          example: "opaque-cursor-token"
        size:
          type: "integer"
          format: "int32"
          description: "Number of results per page."
          example: 20
          maximum: 50
          minimum: 1
    GetAvailableSeatsRequest:
      type: "object"
      description: "Offset-based pagination query for currently available seats on\
        \ a scheduled trip."
      properties:
        page:
          type: "integer"
          format: "int32"
          description: "Zero-based page index."
          example: 0
          minimum: 0
        size:
          type: "integer"
          format: "int32"
          description: "Number of seats per page."
