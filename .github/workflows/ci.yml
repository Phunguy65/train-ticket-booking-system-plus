name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel redundant runs on the same PR branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Minimal default permissions — each job opts-in to what it needs
permissions:
  contents: read

jobs:
  # ── Detect which workspaces have changed ──────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      admin: ${{ steps.filter.outputs.admin }}
      customer: ${{ steps.filter.outputs.customer }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'build-logic/**'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
            admin:
              - 'frontend/admin/**'
            customer:
              - 'frontend/customer/**'
              - 'build-logic/**'
              - 'gradle/**'

  # ── Backend: Lint ─────────────────────────────────────────────────────────
  lint-backend:
    name: Lint / Backend
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Spotless check
        working-directory: backend
        run: ./gradlew spotlessCheck

  # ── Backend: Test ─────────────────────────────────────────────────────────
  test-backend:
    name: Test / Backend
    needs: [detect-changes, lint-backend]
    # Run when lint passes; skip entire job (not just lint) if backend unchanged
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        working-directory: backend
        # Tests use H2 in-memory — no PostgreSQL service needed
        run: ./gradlew test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/
          retention-days: 7

  # ── Admin: Lint + Build ───────────────────────────────────────────────────
  lint-build-admin:
    name: Lint + Build / Admin
    needs: detect-changes
    if: needs.detect-changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: frontend/admin
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        working-directory: frontend/admin
        run: bun --bun run lint

      - name: Build
        working-directory: frontend/admin
        run: bun --bun run build

  # ── Customer: Lint + Test ─────────────────────────────────────────────────
  lint-test-customer:
    name: Lint + Test / Customer
    needs: detect-changes
    if: needs.detect-changes.outputs.customer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Spotless check (ktlint)
        working-directory: frontend/customer
        run: ./gradlew spotlessCheck

      - name: Run JVM tests
        working-directory: frontend/customer
        run: ./gradlew jvmTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-test-reports
          path: frontend/customer/composeApp/build/reports/tests/
          retention-days: 7

  # ── CI Summary — post result comment on PR ────────────────────────────────
  ci-summary:
    name: CI Summary
    if: always() && github.event_name == 'pull_request'
    needs: [lint-backend, test-backend, lint-build-admin, lint-test-customer]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = {
              'Lint / Backend':         '${{ needs.lint-backend.result }}',
              'Test / Backend':         '${{ needs.test-backend.result }}',
              'Lint + Build / Admin':   '${{ needs.lint-build-admin.result }}',
              'Lint + Test / Customer': '${{ needs.lint-test-customer.result }}',
            };

            const icon = (r) =>
              ({ success: '✅', failure: '❌', cancelled: '⚪', skipped: '⏭️' }[r] ?? '❓');

            const rows = Object.entries(jobs)
              .map(([name, result]) => `| ${icon(result)} | ${name} | \`${result}\` |`)
              .join('\n');

            const allOk = Object.values(jobs).every(
              (r) => r === 'success' || r === 'skipped'
            );

            const body = [
              '## CI Results',
              '',
              '| | Job | Status |',
              '|---|---|---|',
              rows,
              '',
              allOk ? '> ✅ All checks passed!' : '> ❌ Some checks failed — please review the logs.',
            ].join('\n');

            // Find and update existing bot comment, or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.startsWith('## CI Results')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
