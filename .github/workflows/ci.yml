name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

# Cancel in-progress runs for the same PR branch or push ref so that only the
# latest commit triggers a full pipeline.
# - PR: groups by head branch name → cancels older runs on the same PR
# - push to main: groups by ref (refs/heads/main) → cancels older pushes
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Minimal default permissions — each job opts in to what it needs.
permissions:
    contents: read

jobs:
    # ── Detect which workspaces have changed ──────────────────────────────────
    detect-changes:
        name: Detect Changes
        runs-on: ubuntu-latest
        outputs:
            backend: ${{ steps.filter.outputs.backend }}
            customer: ${{ steps.filter.outputs.customer }}
            docker: ${{ steps.filter.outputs.docker }}
            gradle: ${{ steps.filter.outputs.gradle }}
        steps:
            - uses: actions/checkout@v4

            - uses: dorny/paths-filter@v4
              id: filter
              with:
                  filters: |
                      backend:
                        - 'backend/**'
                        - 'build-logic/**'
                        - 'gradle/**'
                        - 'gradlew'
                        - 'gradlew.bat'
                        - 'gradle.properties'
                        - 'shared/api-contracts/**'
                      customer:
                        - 'frontend/customer/**'
                        - 'shared/api-contracts/**'
                      docker:
                        - 'backend/Dockerfile'
                        - 'frontend/customer/Dockerfile'
                        - 'docker-compose.yml'
                        - '.dockerignore'
                      gradle:
                        - 'build.gradle.kts'
                        - 'settings.gradle.kts'
                        - 'build-logic/**'
                        - 'gradle.properties'

    # ── Gradle Scripts: Lint ─────────────────────────────────────────────────
    lint-gradle:
        name: Lint / Gradle Scripts
        needs: detect-changes
        if: needs.detect-changes.outputs.gradle == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '25'

            - uses: gradle/actions/setup-gradle@v4

            - name: ktlint check
              run: ./gradlew ktlintCheck

    # ── Backend: Lint ─────────────────────────────────────────────────────────
    lint-backend:
        name: Lint / Backend
        needs: detect-changes
        if: needs.detect-changes.outputs.backend == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '25'

            - uses: gradle/actions/setup-gradle@v4

            - name: Spotless check
              working-directory: backend
              run: ./gradlew spotlessCheck

    # ── Backend: Test ─────────────────────────────────────────────────────────
    test-backend:
        name: Test / Backend
        needs: [detect-changes, lint-backend]
        if: needs.detect-changes.outputs.backend == 'true'
        runs-on: ubuntu-latest
        # Tests use TestContainers (PostgreSQL) — Docker daemon is required
        # and is available on ubuntu-latest runners.
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '25'

            - uses: gradle/actions/setup-gradle@v4

            - name: Run tests
              working-directory: backend
              run: ./gradlew test

            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: backend-test-reports
                  path: backend/build/reports/tests/
                  retention-days: 7

    # ── Customer: Lint + Test + Build ─────────────────────────────────────────
    lint-build-customer:
        name: Lint + Test + Build / Customer
        needs: detect-changes
        if: needs.detect-changes.outputs.customer == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.11

            - name: Install dependencies
              working-directory: frontend/customer
              run: bun install --frozen-lockfile

            - name: Lint (Biome)
              working-directory: frontend/customer
              run: bun --bun run lint

            - name: Run tests (Vitest)
              working-directory: frontend/customer
              run: bun --bun run test

            - name: Build (Next.js)
              working-directory: frontend/customer
              run: bun --bun run build

    # ── Contract check ────────────────────────────────────────────────────────
    # Verifies that the committed shared/api-contracts/openapi.yaml is in sync
    # with the backend source code.  Only runs when backend code changes to
    # avoid the costly TestContainers boot on every PR.
    # The top-level concurrency group already ensures only the latest push on a
    # given branch runs; no extra per-job group is needed.
    contract-check:
        name: Contract Check
        needs: [detect-changes, test-backend]
        if: needs.detect-changes.outputs.backend == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '25'

            - uses: gradle/actions/setup-gradle@v4

            - name: Export customer OpenAPI contract
              # --rerun-tasks bypasses the UP-TO-DATE cache so the exporter always
              # boots the app, fetches /v3/api-docs/customer, and writes the YAML.
              run:
                  ./backend/gradlew -p ./backend exportCustomerOpenApi
                  --rerun-tasks

            - name: Check for contract drift
              # Fail the job if the freshly generated YAML differs from the committed
              # artifact — the developer must regenerate and commit the updated file.
              run: |
                  if ! git diff --exit-code shared/api-contracts/openapi.yaml; then
                    echo ""
                    echo "❌ shared/api-contracts/openapi.yaml is out of sync with the backend."
                    echo "   Run 'pnpm run customer:contract:refresh' and commit the updated file."
                    exit 1
                  fi
                  echo "✅ Contract is in sync."

    # ── Docker: image validation ───────────────────────────────────────────────
    # Validates both Dockerfiles build correctly and smoke-tests the customer
    # Bun runtime image before merge. Does not push images.
    docker-build:
        name: Docker Image Validation
        needs: detect-changes
        if: |
            needs.detect-changes.outputs.docker == 'true' ||
            needs.detect-changes.outputs.backend == 'true' ||
            needs.detect-changes.outputs.customer == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Build backend image
              run:
                  docker build . -f backend/Dockerfile --tag
                  trainbooking-backend:ci

            - name: Build customer image
              # Context is project root — Dockerfile reads shared/api-contracts/openapi.yaml.
              run:
                  docker build . -f frontend/customer/Dockerfile --tag
                  trainbooking-customer:ci

            - name: Smoke test customer Bun runtime
              run: |
                  docker run --rm trainbooking-customer:ci test -f /app/server.js
                  docker run -d --rm --name trainbooking-customer-ci -p 3001:3000 trainbooking-customer:ci
                  trap 'docker stop trainbooking-customer-ci' EXIT

                  curl -f -I --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:3001 | grep -qi '^content-type: text/html'
                  curl -f -I --retry 20 --retry-delay 1 --retry-connrefused "http://127.0.0.1:3001/_next/image?url=%2Ffavicon.ico&w=32&q=75" | grep -qi '^content-type: image/'

    # ── CI Summary — post result comment on PR ────────────────────────────────
    ci-summary:
        name: CI Summary
        if: always() && github.event_name == 'pull_request'
        needs:
            - lint-gradle
            - lint-backend
            - test-backend
            - lint-build-customer
            - contract-check
            - docker-build
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
        steps:
            - name: Post summary comment
              uses: actions/github-script@v7
              with:
                  script: |
                      const jobs = {
                        'Lint / Gradle Scripts':          '${{ needs.lint-gradle.result }}',
                        'Lint / Backend':                '${{ needs.lint-backend.result }}',
                        'Test / Backend':                '${{ needs.test-backend.result }}',
                        'Lint + Test + Build / Customer': '${{ needs.lint-build-customer.result }}',
                        'Contract Check':                '${{ needs.contract-check.result }}',
                        'Docker Image Validation':       '${{ needs.docker-build.result }}',
                      };

                      const icon = (r) =>
                        ({ success: '✅', failure: '❌', cancelled: '⚪', skipped: '⏭️' }[r] ?? '❓');

                      const rows = Object.entries(jobs)
                        .map(([name, result]) => `| ${icon(result)} | ${name} | \`${result}\` |`)
                        .join('\n');

                      const allOk = Object.values(jobs).every(
                        (r) => r === 'success' || r === 'skipped'
                      );

                      const body = [
                        '## CI Results',
                        '',
                        '| | Job | Status |',
                        '|---|---|---|',
                        rows,
                        '',
                        allOk ? '> ✅ All checks passed!' : '> ❌ Some checks failed — please review the logs.',
                      ].join('\n');

                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                      });

                      const existing = comments.find(
                        (c) => c.user.type === 'Bot' && c.body.startsWith('## CI Results')
                      );

                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existing.id,
                          body,
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body,
                        });
                      }
