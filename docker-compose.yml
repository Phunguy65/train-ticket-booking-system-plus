services:
    valkey:
        image: valkey/valkey:latest
        container_name: trainbooking-valkey
        ports:
            - '6379:6379'
        networks:
            - trainbooking-network
        healthcheck:
            test: ['CMD', 'valkey-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5

    postgres:
        image: postgres:18-alpine
        container_name: trainbooking-postgres
        environment:
            POSTGRES_DB: trainbooking
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            TZ: UTC
            PGTZ: UTC
        ports:
            - '5432:5432'
        volumes:
            - trainbooking-data:/var/lib/postgresql/data
        networks:
            - trainbooking-network
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 10s
            timeout: 5s
            retries: 5
        command:
            - 'postgres'
            - '-c'
            - 'timezone=UTC'

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: trainbooking-backend
        environment:
            SPRING_PROFILES_ACTIVE: dev
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/trainbooking
            SPRING_DATASOURCE_USERNAME: postgres
            SPRING_DATASOURCE_PASSWORD: postgres
            VALKEY_HOST: valkey
            VALKEY_PORT: 6379
            TZ: UTC
        ports:
            - '8080:8080'
        depends_on:
            valkey:
                condition: service_healthy
            postgres:
                condition: service_healthy
        networks:
            - trainbooking-network

    admin:
        build:
            context: ./frontend/admin
            dockerfile: Dockerfile
        container_name: trainbooking-admin
        environment:
            NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
            NEXTAUTH_URL: http://localhost:3000
            NEXTAUTH_SECRET: dev-secret-change-in-production
        ports:
            - '3000:3000'
        depends_on:
            - backend
        networks:
            - trainbooking-network

networks:
    trainbooking-network:
        driver: bridge

volumes:
    trainbooking-data:
