schema: spec-driven

context: |
    Tech stack: Spring Boot (Backend), Next.js (Frontend), PostgreSQL (Database)
    Package manager: pnpm
    Frontend runtime: Bun
rules:
    specs:
        - Ensure specifications are clear and concise
    design: |
        Backend: Vertical Slice Architecture (Spring Modulith + Clean Architecture + DDD)

        Each feature is an independent Spring Modulith module with 3 layers:
          - domain/      → Pure Java (no framework deps): aggregates, value objects, domain events, repository ports, business errors
          - application/ → Use case orchestrators (@Service @Transactional), command/result DTOs, infrastructure ports
          - infrastructure/ → Framework adapters: persistence (JPA), web (REST), and optionally security

        Folder structure per vertical slice (e.g., user/):
          {feature}/
          ├── package-info.java                   # @ApplicationModule - Spring Modulith module boundary
          │                                       # Use @NamedInterface("name") in sub-packages to export to other modules
          │                                       # Use allowedDependencies = {"module::interface"} for cross-module access
          ├── domain/
          │   ├── model/                          # Aggregate root, entities, value objects, role/status enums
          │   │   ├── package-info.java           # Optional: @NamedInterface("model") to expose to other modules
          │   │   ├── {Entity}.java               # Aggregate root with factory methods: create() and reconstitute()
          │   │   ├── {Entity}Id.java             # Type-safe ID value object (wraps UUID)
          │   │   └── {Entity}Status.java         # Lifecycle enum (PENDING, CONFIRMED, CANCELLED, ...)
          │   ├── event/                          # Domain events (past tense naming, published after transaction)
          │   │   ├── {Entity}Created.java
          │   │   ├── {Entity}Confirmed.java
          │   │   └── {Entity}Cancelled.java
          │   ├── repository/                     # Repository port (interface only - no impl here)
          │   │   └── {Entity}Repository.java
          │   └── error/                          # Typed business errors as sealed interfaces (not exceptions)
          │       └── {Entity}Error.java
          ├── application/
          │   ├── usecase/                        # One use case class per operation (SRP)
          │   │   ├── Create{Entity}UseCase.java  # @Service @Transactional - orchestrates create flow
          │   │   └── Get{Entity}UseCase.java     # @Service - query use case
          │   ├── command/                        # Input DTOs for use cases (CQRS-style)
          │   │   └── Create{Entity}Command.java  # Input command DTO for create use case
          │   ├── response/                       # Output DTOs returned by use cases
          │   │   └── {Entity}Response.java       # Output response DTO returned by use cases
          │   ├── port/                           # Ports for infrastructure concerns (optional)
          │   │   └── {Capability}Port.java       # Interface abstracting infrastructure (e.g., PasswordEncoder, TokenProvider)
          │   └── listener/                       # Application event listeners (e.g., for domain events)
          │       └── On{Event}Listener.java      # @Component - listens to domain events and triggers side effects
          └── infrastructure/
              ├── persistence/                    # JPA adapter layer
              │   ├── {Entity}Entity.java         # @Entity - JPA mapping (NOT in domain)
              │   ├── {Entity}JpaRepository.java  # Spring Data JPA interface (package-private)
              │   ├── {Entity}RepositoryAdapter.java  # @Repository - implements domain repository port
              │   └── {Entity}EntityMapper.java   # @Component - maps JPA entity <-> domain model
              ├── adapter/                        # Cross-module port adapters (optional)
              │   └── {Capability}PortAdapter.java  # Implements a port owned by another module (e.g., RouteQueryPortAdapter)
              ├── scheduler/                      # Scheduled jobs (optional)
              │   └── {Feature}Scheduler.java     # @Component @Scheduled - background tasks (e.g., expiry jobs)
              ├── {provider}/                     # Third-party service adapters (optional, named after provider)
              │   ├── {Provider}Config.java       # Provider configuration bean
              │   └── {Provider}GatewayAdapter.java  # Implements application port using provider SDK
              ├── security/                       # Security adapter layer (only for modules owning auth)
              └── web/                            # REST adapter layer
                  ├── {Entity}Controller.java     # @RestController - REST endpoints, returns JsendResponse
                  └── request/                    # HTTP request DTOs (public API contract)
                      └── {Operation}{Entity}Request.java  # Input DTO for HTTP endpoint

        Test structure mirrors main source (under src/test/java/.../):
          {feature}/
          ├── {Feature}ModuleTest.java            # @ApplicationModuleTest - Spring Modulith integration test
          ├── domain/model/
          │   └── {Entity}Test.java              # Pure JUnit 5 unit tests (no Spring)
          ├── application/usecase/
          │   ├── Create{Entity}UseCaseTest.java # @ExtendWith(MockitoExtension) - mocked unit tests
          │   └── Get{Entity}UseCaseTest.java    # @ExtendWith(MockitoExtension) - mocked unit tests
          └── infrastructure/
              ├── persistence/
              │   └── {Entity}RepositoryAdapterTest.java  # @DataJpaTest - persistence integration tests
              ├── security/                               # Security-specific tests (modules with auth only)
              │   └── JwtTokenProviderTest.java           # @ExtendWith(MockitoExtension) - unit tests
              └── web/
                  └── {Entity}ControllerTest.java         # @WebMvcTest - REST API integration tests

      Naming conventions:
        Domain    : {Entity}, {Entity}Id, {Entity}Status, {Entity}Repository, {Entity}Error, {EntityEvent}(past tense)
        Application: {Operation}{Entity}Command, {Entity}Response, {Operation}{Entity}UseCase, {Capability}Port (e.g., PasswordEncoder, TokenProvider)
        Persistence: {Entity}Entity, {Entity}JpaRepository, {Entity}RepositoryAdapter, {Entity}EntityMapper
        Web        : {Entity}Controller, {Operation}{Entity}Request (in web/request/), {Capability}PortAdapter (in infrastructure/adapter/)

      Shared module (type=OPEN, accessible to all modules):
        shared/domain/      → AggregateRoot, DomainEvent, Result<T,E>, Money, ValueObject, PageResult, SortDirection, UuidGenerator
        shared/infrastructure/web/ → GlobalExceptionHandler, JsendResponse (JSend format), SliceHttpResponse,
                                      ErrorCode, FailData, Violation, ViolationCode, ApiVersionParser,
                                      JacksonConfig, WebConfig

      Key patterns:
        - Port-Adapter: domain defines repository interface, infrastructure implements it
        - Application Ports: abstract infrastructure concerns (JWT, BCrypt, email) behind interfaces in application/port/
        - Cross-module Port: port interface owned by the consuming module (application/port/), implemented by the
          providing module's infrastructure layer (infrastructure/adapter/ or infrastructure/persistence/)
          e.g., BookingValidationPort defined in user/application/port/, implemented in booking/infrastructure/persistence/
        - Result monad: domain methods return Result<T, E> instead of throwing exceptions
        - Factory methods: create() registers domain events; reconstitute() does not
        - Idempotency: use cases check idempotency key before processing
        - One use case per operation (no god-service classes)
        - CQRS-style DTOs: commands (input) live in application/command/, response DTOs (output) in application/response/
        - Named Interface: expose sub-packages via @NamedInterface in package-info.java for controlled cross-module access
        - ArchUnit enforces: no JPA in domain, no framework in domain, no infra deps in application layer
