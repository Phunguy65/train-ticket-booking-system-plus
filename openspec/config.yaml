schema: spec-driven

context: |
    Tech stack: Spring Boot (Backend), Next.js (Frontend), PostgreSQL (Database)
    Package manager: pnpm
    Frontend runtime: Bun
rules:
    specs:
        - Ensure specifications are clear and concise
    design:
        - |
            Backend: Clean Architecture

            Each feature is an independent module with 3 layers:
              - domain/         → Pure Java business core (no framework deps): entities, value objects, domain services, domain events, repository interfaces, business errors
              - application/    → Use cases, command/query DTOs, response DTOs, transaction orchestration, application services
              - infrastructure/ → Technical adapters: persistence (JPA), web (REST), security, messaging, schedulers, and third-party integrations

            Cross-module access:
              - Cross-module access is allowed without explicit module-boundary restrictions
              - A module may depend directly on another module's domain/ and application/ contracts
              - A module must not depend on another module's infrastructure/ layer
              - Do not use consumer-owned ports for internal module-to-module communication

            Ports:
              - Ports are only for external services / external systems
              - Examples: Firebase, Stripe, SMTP, SMS gateway, S3, OAuth providers, message brokers
              - Repository interfaces remain in domain/repository/ and are not treated as external-service ports
              - Internal module-to-module collaboration should use direct dependency on domain/application contracts instead of port-adapter indirection

            Folder structure per feature (e.g., user/):
              {feature}/
              ├── domain/
              │   ├── model/                          # Entities, aggregates, value objects, enums
              │   │   ├── {Entity}.java
              │   │   ├── {Entity}Id.java
              │   │   └── {Entity}Status.java
              │   ├── service/                        # Optional domain services
              │   ├── event/                          # Domain events
              │   │   ├── {Entity}Created.java
              │   │   ├── {Entity}Updated.java
              │   │   └── {Entity}Cancelled.java
              │   ├── repository/                     # Repository interfaces only
              │   │   └── {Entity}Repository.java
              │   └── error/                          # Business/domain errors
              │       └── {Entity}Error.java
              ├── application/
              │   ├── usecase/                        # One use case per operation
              │   │   ├── Create{Entity}UseCase.java
              │   │   └── Get{Entity}UseCase.java
              │   ├── command/                        # Input DTOs for commands
              │   │   └── Create{Entity}Command.java
              │   ├── query/                          # Input DTOs for queries
              │   │   └── Get{Entity}Query.java
              │   ├── response/                       # Output DTOs
              │   │   └── {Entity}Response.java
              │   └── mapper/                         # Optional application mappers
              └── infrastructure/
                  ├── persistence/                    # JPA entities, repositories, mappers, adapters
                  │   ├── {Entity}Entity.java
                  │   ├── {Entity}JpaRepository.java
                  │   ├── {Entity}RepositoryAdapter.java
                  │   └── {Entity}EntityMapper.java
                  ├── web/                            # Controllers and request DTOs
                  │   ├── {Entity}Controller.java
                  │   └── request/
                  │       └── {Operation}{Entity}Request.java
                  ├── security/                       # Optional security adapters
                  ├── messaging/                      # Optional messaging adapters
                  ├── scheduler/                      # Optional scheduled jobs
                  └── external/                       # External service adapters only
                      └── {provider}/
                          ├── {Provider}Config.java
                          └── {Provider}Adapter.java

            Test structure mirrors main source (under src/test/java/.../):
              {feature}/
              ├── domain/model/
              │   └── {Entity}Test.java              # Pure unit tests
              ├── application/usecase/
              │   ├── Create{Entity}UseCaseTest.java
              │   └── Get{Entity}UseCaseTest.java
              └── infrastructure/
                  ├── persistence/
                  │   └── {Entity}RepositoryAdapterTest.java
                  ├── security/
                  │   └── {SecurityComponent}Test.java
                  ├── external/
                  │   └── {Provider}AdapterTest.java
                  └── web/
                      └── {Entity}ControllerTest.java

            Naming conventions:
              Domain        : {Entity}, {Entity}Id, {Entity}Status, {Entity}Repository, {Entity}Error, {EntityEvent}
              Application   : {Operation}{Entity}Command, {Operation}{Entity}Query, {Entity}Response, {Operation}{Entity}UseCase
              Persistence   : {Entity}Entity, {Entity}JpaRepository, {Entity}RepositoryAdapter, {Entity}EntityMapper
              External port : {Provider}{Capability}Port or {Capability}Port
              External impl : {Provider}Adapter
              Web           : {Entity}Controller, {Operation}{Entity}Request

            Shared module:
              shared/domain/                → shared value objects, Result<T,E>, base domain abstractions
              shared/application/           → shared application DTOs if truly cross-cutting
              shared/infrastructure/web/    → common web response/error handling utilities

            Key patterns:
              - Repository pattern: domain defines repository interfaces, infrastructure implements them
              - External Service Port-Adapter: application defines ports only for external systems; infrastructure provides adapters
              - Direct cross-module collaboration: internal modules may depend directly on other modules' domain/application contracts
              - Result monad: use Result<T, E> instead of exceptions where appropriate
              - Factory methods: create() registers domain events; reconstitute() does not
              - One use case per operation (no god-service classes)
              - CQRS-style DTOs: commands in application/command/, queries in application/query/, responses in application/response/
              - Clean Architecture enforcement: no framework in domain, no infrastructure dependency from application, no JPA in domain
