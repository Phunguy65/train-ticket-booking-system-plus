[versions]
# ─── Java ─────────────────────────────────────────────────────────────────
archunitJunit5 = "1.4.1"
jacksonDatabindNullable = "0.2.9"
java = "25"
# ─── Backend ─────────────────────────────────────────────────────────────────
springBoot = "4.0.3"
jjwt = "0.13.0"
springDependencyManagement = "1.1.7"
springModulith = "2.0.3"
hibernateOrm = "7.2.1.Final"
graalvmNative = "0.11.4"
spotless = "8.2.1"
palantirJavaFormat = "2.88.0"

# ─── Frontend ─────────────────────────────────────────────────────────────────
agp = "9.0.0"
androidCompileSdk = "36"
androidMinSdk = "24"
androidTargetSdk = "36"
androidxActivity = "1.12.4"
androidxAppcompat = "1.7.1"
androidxCore = "1.17.0"
androidxEspresso = "3.7.0"
androidxLifecycle = "2.9.6"
androidxTestExt = "1.3.0"
composeHotReload = "1.0.0"
composeMultiplatform = "1.10.1"
composeNavigation = "2.5.3"
material3 = "1.9.0"
junit = "4.13.2"
kotlin = "2.3.10"
kotlinxCoroutines = "1.10.2"
ktlint = "1.8.0"
ktlintComposeRules = "0.5.6"
runtime = "1.10.3"
jspecify = "1.0.0"

[libraries]
# ─── Backend ─────────────────────────────────────────────────────────────────
jackson-databind-nullable = { module = "org.openapitools:jackson-databind-nullable", version.ref = "jacksonDatabindNullable" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "springModulith" }

# Spring Boot Starters (version managed by Spring Boot BOM)
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-amqp = { module = "org.springframework.boot:spring-boot-starter-amqp" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-integration = { module = "org.springframework.boot:spring-boot-starter-integration" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }

# Spring AMQP
spring-rabbit-stream = { module = "org.springframework.amqp:spring-rabbit-stream" }

# Spring Integration
spring-integration-amqp = { module = "org.springframework.integration:spring-integration-amqp" }
spring-integration-http = { module = "org.springframework.integration:spring-integration-http" }
spring-integration-jpa = { module = "org.springframework.integration:spring-integration-jpa" }
spring-integration-test = { module = "org.springframework.integration:spring-integration-test" }

# Spring Modulith
spring-modulith-events-api = { module = "org.springframework.modulith:spring-modulith-events-api" }
spring-modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
spring-modulith-starter-jpa = { module = "org.springframework.modulith:spring-modulith-starter-jpa" }
spring-modulith-actuator = { module = "org.springframework.modulith:spring-modulith-actuator" }
spring-modulith-events-amqp = { module = "org.springframework.modulith:spring-modulith-events-amqp" }
spring-modulith-observability = { module = "org.springframework.modulith:spring-modulith-observability" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }

# Spring Security
spring-security-messaging = { module = "org.springframework.security:spring-security-messaging" }

# Jspecify
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

# JJWT
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# PostgreSQL
postgresql = { module = "org.postgresql:postgresql" }

# JUnit Platform
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Spring Boot Test Starters
spring-boot-starter-actuator-test = { module = "org.springframework.boot:spring-boot-starter-actuator-test" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunitJunit5" }
h2 = { module = "com.h2database:h2" }

# ─── Frontend – Kotlin & Testing ─────────────────────────────────────────────
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }

# ─── Frontend – AndroidX ─────────────────────────────────────────────────────
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxEspresso" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }

# ─── Frontend – Compose Multiplatform ────────────────────────────────────────
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-navigation = { module = "org.jetbrains.compose.navigation:navigation", version.ref = "composeNavigation" }
ktlint-compose-rules = { module = "io.nlopez.compose.rules:ktlint", version.ref = "ktlintComposeRules" }
# ─── Frontend – Coroutines ────────────────────────────────────────────────────
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }
androidx-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "runtime" }

[plugins]
# ─── Backend ─────────────────────────────────────────────────────────────────
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
hibernateOrm = { id = "org.hibernate.orm", version.ref = "hibernateOrm" }
graalvmNative = { id = "org.graalvm.buildtools.native", version.ref = "graalvmNative" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# ─── Frontend ─────────────────────────────────────────────────────────────────
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeHotReload = { id = "org.jetbrains.compose.hot-reload", version.ref = "composeHotReload" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }


# ─── Custom Plugin ─────────────────────────────────────────────────────────────
spotlessConvention = { id = "io.github.phunguy65.ttbs.plugin.spotless"  }
